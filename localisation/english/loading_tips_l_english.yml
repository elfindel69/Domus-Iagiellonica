 # Historical Polish-Lithuanian quotations (10)
 LOADING_TIP_0:0 "Free with the free, equal with the equal.\n- Maxim associated with the Union of Lublin, 1569"
 LOADING_TIP_1:0 "Such will be the Commonwealths as the upbringing of their youth.\n- Jan Zamoyski, Foundation Act of the Zamoyski Academy, 1600"
 LOADING_TIP_2:0 "We came, we saw, God conquered.\n- King John III Sobieski after the Battle of Vienna, 1683"
 LOADING_TIP_3:0 "All power in civil society should be derived from the will of the people.\n- Constitution of 3 May, 1792"
 LOADING_TIP_4:0 "For our freedom and yours.\n- Polish insurgent motto, 1831"
 LOADING_TIP_5:0 "Poland has not yet perished, so long as we still live.\n- JÃ³zef Wybicki, 1797"
 LOADING_TIP_6:0 "To be defeated and not submit is victory; to win and rest on one's laurels is defeat.\n- Józef Piłsudski"
 LOADING_TIP_7:0 "Whoever does not respect the past has no right to the future.\n- Józef Piłsudski, commonly attributed"
 LOADING_TIP_8:0 "Nothing in life is to be feared; it is only to be understood.\n- Maria Skłodowska-Curie"
 LOADING_TIP_9:0 "Mathematics is written for mathematicians.\n- Nicolaus Copernicus, On the Revolutions, 1543"

 # International quotations (8)
 LOADING_TIP_10:0 "The supreme art of war is to subdue the enemy without fighting.\n- Sun Tzu, The Art of War"
 LOADING_TIP_11:0 "War is merely the continuation of policy by other means.\n- Carl von Clausewitz, On War"
 LOADING_TIP_12:0 "An army marches on its stomach.\n- Maxim attributed to Napoleon Bonaparte"
 LOADING_TIP_13:0 "A house divided against itself cannot stand.\n- Abraham Lincoln, 1858"
 LOADING_TIP_14:0 "My centre is giving way, my right is retreating. Situation excellent. I am attacking.\n- Ferdinand Foch, traditionally attributed, 1914"
 LOADING_TIP_15:0 "Victory at all costs, victory in spite of all terror, victory however long and hard the road may be.\n- Winston Churchill, 1940"
 LOADING_TIP_16:0 "The only thing we have to fear is fear itself.\n- Franklin D. Roosevelt, 1933"
 LOADING_TIP_17:0 "The buck stops here.\n- Harry S. Truman"

 # Fictional quotations from DOI characters (12)
 LOADING_TIP_18:0 "The Crown is not an ornament placed above the Commonwealth. It is the promise that no nation within it stands alone.\n- King John V, address to the Sejm, 1936"
 LOADING_TIP_19:0 "We inherited a union of peoples; our duty is to leave them a union of citizens.\n- King John V, Royal Constitution Day address, 1937"
 LOADING_TIP_20:0 "Germany expects our frontiers to divide us. They will discover that the Vistula, Niemen and Dnieper flow through the same realm.\n- Władysław Sikorski, Council of Ministers, 1938"
 LOADING_TIP_21:0 "A peace treaty is not a gravestone for the last war. It is the first defensive work of the next peace.\n- Władysław Sikorski, Warsaw Conference, 1942"
 LOADING_TIP_22:0 "We shall not trade space for time when our cities, factories and citizens occupy that space.\n- Edward Rydz-Śmigły, General Staff conference, 1939"
 LOADING_TIP_23:0 "The Black Hussar does not charge for spectacle. It strikes where the enemy has mistaken movement for weakness.\n- Edward Rydz-Śmigły, operational directive, 1941"
 LOADING_TIP_24:0 "A nation that fears discipline will one day receive discipline from a foreign conqueror.\n- Bolesław Piasecki, National Congress speech, 1936"
 LOADING_TIP_25:0 "The Commonwealth must be strong enough to tolerate disagreement and united enough to survive it.\n- Bolesław Piasecki, parliamentary debate, 1938"
 LOADING_TIP_26:0 "The peasant does not ask whether the state is glorious. He asks whether it remembers who feeds it.\n- Wincenty Witos, Agrarian Congress, 1936"
 LOADING_TIP_27:0 "A field left untilled weakens the kingdom as surely as a fortress left unmanned.\n- Wincenty Witos, rural reconstruction speech, 1943"
 LOADING_TIP_28:0 "There can be no common victory while workers are asked to bear uncommon sacrifices.\n- Wanda Wasilewska, workers' pamphlet, 1937"
 LOADING_TIP_29:0 "The Axis can occupy a station, a ministry or a street. It cannot occupy an idea whose time has come.\n- Wanda Wasilewska, clandestine address, 1940"

 # Lore treaties and events (8)
 LOADING_TIP_30:0 "The Crown of Poland and the Grand Duchy of Lithuania shall form one indivisible Commonwealth under a hereditary Jagiellonian Crown.\n- Act of the Union of Lublin, 1569"
 LOADING_TIP_31:0 "The King accepts the Constitution as the common safeguard of liberty, order and the enduring union of the realm.\n- Constitution of 3 May, 1792"
 LOADING_TIP_32:0 "Germany shall withdraw all forces from Silesia, Prussia Proper and the northern approaches to Bohemia.\n- Treaty of Stettin, 15 March 1918"
 LOADING_TIP_33:0 "Germany recognizes the territorial integrity of Poland-Lithuania and renounces support for all forces seeking its dismemberment.\n- Treaty of Versailles, January 1919"
 LOADING_TIP_34:0 "Germany formally renounces all claims to Silesia, Prussia Proper, Warmia-Masuria and Eastern Pomerania.\n- Treaty of Warsaw, 1 September 1942"
 LOADING_TIP_35:0 "The purpose of disarmament is not vengeance, but the restoration of a European peace that can enforce itself.\n- Preamble to the Treaty of Warsaw, 1942"
 LOADING_TIP_36:0 "Japan renounces aggressive war and all claims to Korea, Taiwan, Manchuria and its former Pacific possessions.\n- Treaty of Tokyo, 2 September 1945"
 LOADING_TIP_37:0 "The Chinese revolutionary armies shall lay down their arms and submit to the authority of the Republic.\n- Shanghai Accords, 1949"

 # Military and gameplay advice (8)
 LOADING_TIP_38:0 "A broad Commonwealth needs railways as much as divisions. Upgrade supply lines before opening a distant front."
 LOADING_TIP_39:0 "The Baltic is narrow, mined and exposed to land-based aircraft. Screens and naval bombers may matter more than battleships."
 LOADING_TIP_40:0 "Polish, Lithuanian and Ruthenian formations share a state, but not always the same terrain. Build each division for the front it must defend."
 LOADING_TIP_41:0 "The colonies extend your reach into Africa and the Indian Ocean. Without convoys and escorts, they can become isolated liabilities."
 LOADING_TIP_42:0 "Reserve divisions cost less in peacetime, but mobilization takes time. Do not wait for the first enemy shell to call them up."
 LOADING_TIP_43:0 "PZL and ANBO aircraft can contest the skies, but obsolete airframes suffer quickly against modern interceptors."
 LOADING_TIP_44:0 "Forts can delay an offensive; they cannot replace mobile reserves able to seal a breakthrough."
 LOADING_TIP_45:0 "The Commonwealth's politics shape its army, economy and alliances. A focus completed today may decide who answers your call tomorrow."

 # Easter eggs (2)
 LOADING_TIP_46:0 "Giraffes are heartless creatures."
 LOADING_TIP_47:0 "If the battle plan is flawless but nobody can find it, check whether the cat is sleeping on the map."

