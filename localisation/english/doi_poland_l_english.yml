l_english:
 POL_the_commonwealth_in_1936:0 "The Commonwealth in 1936"
 POL_the_commonwealth_in_1936_desc:0 "Victorious in the Great War, the Polish-Lithuanian Commonwealth enters 1936 as a major European power. Yet constitutional tensions, regional inequalities and doubts about the future of the Jagiellonian state endure beneath its prestige. Before confronting the gathering storms abroad, we must assess the condition of the Commonwealth."
 POL_the_commonwealth_in_1936_tt:0 "Begin a review of the Commonwealth's political and federal institutions."
 POL_the_crown_and_the_sejm_focus:0 "The Crown and the Sejm"
 POL_the_crown_and_the_sejm_focus_desc:0 "King Jan V has reigned through war, victory and economic crisis. Yet the division of authority between the Crown, the government and the Sejm has grown increasingly unclear. Royal ministers demand decisive leadership, while parliamentary leaders oppose any lasting expansion of the King's powers."
 POL_the_crown_and_the_sejm_tt:0 "Review the balance of power between the Crown, the Sejm and the government."
 POL_review_the_federal_compact:0 "Review the Federal Compact"
 POL_review_the_federal_compact_desc:0 "The Commonwealth unites many nations beneath the Jagiellonian Crown, but representation, language rights, taxation and military obligations remain disputed. We must decide whether to renew the federal compact, preserve the existing settlement or strengthen central authority."
 POL_review_the_federal_compact_tt:0 "Review the political organisation of the Commonwealth and its constituent nations."
 POL_the_question_of_government:0 "The Question of Government"
 POL_the_question_of_government_desc:0 "The institutional reviews have exposed divisions that can no longer be ignored. Constitutionalists, royalists, the OZN, democrats, national radicals and socialists each offer a different future for the Commonwealth. The time for compromise is ending: Poland-Lithuania must decide how it will be governed."
 

 POL_constitutional_consultations:0 "Constitutional Consultations"
 POL_constitutional_consultations_desc:0 "Representatives of the Crown, the government and the Sejm have begun a series of formal consultations on the future balance of power within the Commonwealth. The negotiations have reassured those who feared an immediate constitutional crisis, but ministers must now devote considerable time and political capital to reconciling royal authority, parliamentary prerogatives and the demands of effective government."
 POL_federal_review:0 "Federal Review"
 POL_federal_review_desc:0 "Commissions representing the Commonwealth’s constituent nations have begun reviewing the federal settlement. Their work has encouraged cooperation with regional authorities and offered neglected communities a greater voice in public affairs. Yet reopening questions of representation, language rights, taxation and military obligations consumes political capital and risks exposing divisions long contained beneath the Jagiellonian Crown."
 POL_government_in_deadlock:0 "The Government Question"
 POL_government_in_deadlock_desc:0 "The constitutional debate has entered a decisive phase. Until a durable government is formed, neither the Crown nor the Sejm can exercise its full authority."
 POL_cabinet_of_compromise:0 "Cabinet of Compromise"
 POL_cabinet_of_compromise_desc:0 "A coalition of constitutional conservatives, moderate federalists and non-partisan ministers has been entrusted with preserving cooperation between the Crown and the Sejm. Its broad composition has reassured the public, but every important decision requires extensive negotiations between its competing factions."
 POL_witos_cabinet:0 "Witos Government"
 POL_witos_cabinet_desc:0 "Wincenty Witos has assembled a parliamentary government supported by agrarians, liberals and advocates of federal reform. Its appeal extends well beyond Warsaw, but its ambitious programme faces resistance from the conservative establishment and the Royal Court."

 poland_rework.1.t:0 "The Government Resigns"
 poland_rework.1.d:0 "After weeks of constitutional debate, the government has admitted that it can no longer command sufficient authority and has presented its resignation to King Jan V.\n\nModerates call for another cabinet of compromise. The Camp of National Unity supports Felicjan Sławoj Składkowski, while the parliamentary opposition rallies behind Wincenty Witos. At Court, royal advisers argue that the failure of party government justifies a ministry responsible directly to the King.\n\nJan V must now decide who will lead the Commonwealth through the crisis."
 poland_rework.1.a:0 "Entrust the moderates with a cabinet of compromise"
 poland_rework.1.b:0 "Ask Sławoj Składkowski to restore order" 
 poland_rework.1.c:0 "Invite Wincenty Witos to form a government"
 poland_rework.1.e:0 "Appoint a government responsible to the Crown"
 poland_rework.2.t:0 "The Government Faces the Sejm"
 poland_rework.2.compromise_desc:0 "The newly appointed cabinet has presented its programme before the Sejm, promising to preserve the constitutional balance while addressing the weaknesses exposed by the recent institutional reviews. Its moderate proposals have won cautious support across the centre, but neither the royalists nor the parliamentary opposition are satisfied. Both sides now demand clearer guarantees concerning the respective powers of the Crown and the legislature.\n\nThe cabinet may yet assemble a working majority, but only through concessions that could leave it too divided to govern effectively."
 poland_rework.2.ozn_desc:0 "Prime Minister Sławoj Składkowski has presented the Sejm with an ambitious programme of administrative reform, national discipline and executive efficiency. Deputies sympathetic to the Camp of National Unity praise his determination to restore authority to the state. The opposition, however, accuses the government of treating Parliament as an obstacle rather than a constitutional partner.\n\nSkładkowski has requested broad powers to enact his programme. Whether the Sejm accepts, resists or is circumvented will determine far more than the fate of this ministry."
 poland_rework.2.witos_desc:0 "Wincenty Witos has returned to the head of government with the support of agrarians, liberals and advocates of parliamentary reform. His programme calls for a ministry firmly responsible before the Sejm, renewed guarantees for the constituent nations and relief for the countryside. The parliamentary benches have greeted him warmly, but the Royal Court and conservative establishment fear that his reforms would permanently reduce the Crown's influence.\n\nWitos possesses a potential majority, yet its competing factions must still be persuaded to govern together."
 poland_rework.2.royal_desc:0 "The ministry appointed by Jan V has presented itself before a deeply suspicious Sejm. Royal advisers insist that the cabinet remains within the powers granted to the Crown by the Constitution of May Third, but many deputies see its programme as an attempt to establish government without meaningful parliamentary consent.\n\nThe ministry can rely upon the King's confidence, the senior administration and sections of the officer corps. It cannot yet rely upon the legislature. Jan V must decide how far he is prepared to press the royal prerogative."
 poland_rework.2.a:0 "Negotiate a parliamentary compromise"
 poland_rework.2.b:0 "The King must arbitrate the dispute"
 poland_rework.2.c:0 "The state cannot wait upon the parties"
 poland_rework.2.e:0 "The opposition must seize the initiative"
 poland_rework.20.t:0 "The Opposition Responds"
 poland_rework.20.d:0 "With the government and the Sejm unable to agree upon the exercise of power, the initiative is passing to forces outside the cabinet. Parliamentary leaders demand an early appeal to the electorate, while national radicals and socialists each claim that the deadlock proves the failure of the established order. The course adopted by the opposition may decide whether the crisis returns to constitutional politics or escapes its control entirely."
 poland_rework.20.a:0 "Promise an early general election"
 poland_rework.20.b:0 "The national opposition will break the deadlock"
 poland_rework.20.c:0 "The workers must answer the failure of the ruling class"
 poland_rework.3.t:0 "The Federal Commission Reports"
 poland_rework.3.d:0 "After months of hearings across the Commonwealth, the Commission on the Federal Compact has submitted its report to the Crown and the Sejm. It praises the union beneath the Jagiellonian Crown, but warns that tradition alone can no longer preserve it.\n\nFederalists demand stronger regional and linguistic guarantees, while conservatives defend the existing settlement. Royalists and the Camp of National Unity favour greater central authority. Beyond them, national radicals demand Polish supremacy, while socialists propose a federation of popular republics.\n\nThe government must decide what kind of Commonwealth it intends to preserve."
 poland_rework.3.a:0 "Renew the compact between equal nations"
 poland_rework.3.b:0 "Preserve the historic balance of the Commonwealth"
 poland_rework.3.c:0 "Place every province beneath a common administration"
 poland_rework.3.e:0 "Reject the commission's constitutional assumptions"
 poland_rework.30.t:0 "Beyond the Federal Compact"
 poland_rework.30.d:0 "The most radical opponents of the Commission reject the premise that the historic compact can still be repaired. National radicals demand a unitary state founded upon undisputed Polish leadership. The socialist opposition instead calls for the old dynastic union to be replaced by a federation of popular republics. Both programmes would sweep aside the compromise defended by the Crown and the constitutional parties."
 poland_rework.30.a:0 "Poland must lead the Commonwealth without apology"
 poland_rework.30.b:0 "Replace the old union with a federation of popular republics"
 poland_rework.4.t:0 "The King's Decision"
 poland_rework.4.d:0 "For weeks, reports, petitions and private warnings have accumulated upon the King's desk. The resignation of the old government, the confrontation in the Sejm and the conclusions of the Federal Commission have transformed a dispute over ministries into a struggle over the future character of the Commonwealth.\n\nEach political camp now claims that it alone possesses the authority required to resolve the crisis. The constitutionalists offer continuity through compromise. The royalists urge Jan V to assume direct responsibility for the state. The Camp of National Unity promises discipline beneath a powerful executive, while the parliamentary opposition demands a government resting upon the confidence of the Sejm. Beyond them, the national radicals and the socialist movement insist that the old constitutional order has already exhausted itself.\n\nJan V cannot postpone his decision any longer. Whomever he summons to govern will inherit not only the ministries of the Commonwealth, but the power to reshape its institutions."
 poland_rework.4.a:0 "The Crown and the Sejm shall govern together"
 POL_constitutionalist_government_tt:0 "A new §Yconstitutional cabinet§! will be formed. Jan V will remain the arbiter of the Commonwealth, while the historic balance between the Crown and the Sejm is preserved."
 poland_rework.4.b:0 "The Crown must assume responsibility"
 poland_rework.4.c:0 "Składkowski shall be entrusted with the state"
 poland_rework.4.e:0 "Witos shall form a government of the Sejm"
 poland_rework.4.f:0 "Piasecki alone can break the deadlock"
 poland_rework.4.g:0 "Wasilewska shall speak for the workers"

 POL_constitutionalists_gain_support_tt:0 "The §YConstitutionalists§! will gain influence and public support."
 POL_ozn_gains_support_tt:0 "The §YCamp of National Unity§! will gain influence and public support."
 POL_democrats_gain_support_tt:0 "The §YParliamentary Opposition§! will gain influence and public support."
 POL_royalists_gain_support_tt:0 "The §YRoyalists§! will gain influence and public support."
 POL_parliamentary_compromise_tt:0 "The §YConstitutionalists§! and the §YParliamentary Opposition§! will both gain influence. Democratic support will increase."
 POL_crown_arbitration_tt:0 "The §YRoyalists§! will gain considerable influence. Support for the monarchist parties will increase."
 POL_bypass_the_sejm_tt:0 "The §YCamp of National Unity§! will gain considerable influence. Support for the non-aligned parties will increase."
 POL_early_elections_tt:0 "The §YParliamentary Opposition§! will gain considerable influence. Democratic support will increase."
 POL_nationalists_exploit_crisis_tt:0 "The §YNational Radicals§! will exploit the political deadlock. Fascist support will increase."
 POL_socialists_exploit_crisis_tt:0 "The §YSocialist Opposition§! will exploit the political deadlock. Communist support will increase."
 POL_federalist_settlement_tt:0 "The §YConstitutionalists§! and the §YParliamentary Opposition§! will gain influence. The future government will be able to transform the Commonwealth into a more equal and decentralised federation."
 POL_balanced_settlement_tt:0 "The §YConstitutionalists§! will gain considerable influence. The existing division of authority between Warsaw and the constituent lands will be preserved."
 POL_centralist_settlement_tt:0 "The §YRoyalists§! and the §YCamp of National Unity§! will gain influence. The future government will be able to centralise the Commonwealth and reduce regional autonomy."
 POL_national_supremacy_settlement_tt:0 "The §YNational Radicals§! will gain considerable influence. Their programme would subordinate the other nations of the Commonwealth to a centralised Polish national state."
 POL_socialist_federal_settlement_tt:0 "The §YSocialist Opposition§! will gain considerable influence. Their programme would replace the Jagiellonian Commonwealth with a federation of socialist republics."
 POL_royalist_government_tt:0 "A §Yroyalist ministry§! responsible directly to Jan V will take office. The King's constitutional prerogatives will be expanded at the expense of the Sejm."
 POL_ozn_government_tt:0 "The §YCamp of National Unity§! will establish an authoritarian government under Sławoj Składkowski. The monarchy will remain, but political authority will increasingly rest with the executive."
 POL_democratic_government_tt:0 "A §Yparliamentary government§! led by Wincenty Witos will take office. The Crown will accept a more limited constitutional role and free elections will be confirmed."
 POL_nationalist_government_tt:0 "The §YNational Radicals§! will seize the political initiative under Bolesław Piasecki. Jan V will retain the Crown temporarily, but the new regime will no longer recognise him as the final arbiter of the state."
 POL_socialist_government_tt:0 "The §YSocialist Opposition§! will form a revolutionary government under Wanda Wasilewska. The authority of the Jagiellonian Crown will be openly challenged, though the final fate of the monarchy remains unresolved."