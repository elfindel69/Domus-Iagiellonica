l_english:
 POL_a_commonwealth_divided_by_development:0 "A Commonwealth Divided by Development"
 POL_a_commonwealth_divided_by_development_desc:0 "The factories of Warsaw, Silesia, Gdańsk and Prussia stand beside eastern lands with far fewer roads and workshops. We must bring the Commonwealth’s two economies into one programme."
 POL_develop_the_eastern_commonwealth:0 "Develop the Eastern Commonwealth"
 POL_develop_the_eastern_commonwealth_desc:0 "Lithuania, Belarus, Ruthenia and the Ukrainian borderlands require sustained investment. Their development must proceed alongside the industrial core."
 POL_develop_gdansk_and_prussia:0 "Develop Gdańsk and Prussia"
 POL_develop_gdansk_and_prussia_desc:0 "The Baltic port and Prussian districts can form a second industrial belt, linking trade, metalworking and inland production."
 POL_lithuanian_and_belarusian_infrastructure:0 "Lithuanian and Belarusian Infrastructure"
 POL_lithuanian_and_belarusian_infrastructure_desc:0 "New roads and railway approaches around Kaunas, Brest and Minsk will connect communities that have long been distant from the Commonwealth market."
 POL_invest_in_ukrainian_borderlands:0 "Invest in the Ukrainian Borderlands"
 POL_invest_in_ukrainian_borderlands_desc:0 "The Commonwealth’s Volhynian and Galician districts need factories and dependable transport, offering work beyond the established industrial cities."
 POL_integrate_the_commonwealth_market:0 "Integrate the Commonwealth Market"
 POL_integrate_the_commonwealth_market_desc:0 "With factories, mines, borderlands and rail junctions linked, goods can finally move between the two halves of the Commonwealth at a common pace."
 POL_expand_the_chemical_sector:0 "Expand the Chemical Sector"
 POL_expand_the_chemical_sector_desc:0 "Our scientists and manufacturers can enlarge the chemical industry and build additional synthetic capacity near the industrial core."
 POL_synthetic_independence:0 "Synthetic Independence"
 POL_synthetic_independence_desc:0 "Further research and production will reduce our reliance on imported fuel and synthetic materials when wartime trade is interrupted."
 POL_state_fuel_reserves:0 "State Fuel Reserves"
 POL_state_fuel_reserves_desc:0 "Refineries alone cannot protect the Commonwealth from a supply shock. Strategic fuel depots at Warsaw, Gdańsk and Lwów will support long campaigns."
 POL_integrated_commonwealth_economy:0 "Integrated Commonwealth Economy"
 POL_integrated_commonwealth_economy_desc:0 "The industrial core and eastern provinces will share one market, with lower barriers, better infrastructure and broadly distributed production."
 POL_arsenal_of_eastern_europe:0 "Arsenal of Eastern Europe"
 POL_arsenal_of_eastern_europe_desc:0 "The Commonwealth will direct its integrated industry toward armaments and make its factories a strategic arsenal for the region."
 POL_planned_federal_development:0 "Planned Federal Development"
 POL_planned_federal_development_desc:0 "A federal investment programme will keep factories, infrastructure and regional development under coordinated public direction."
 POL_commonwealth_market_links:0 "Commonwealth Market Links"
 POL_commonwealth_market_links_desc:0 "Railways and industrial investment are drawing the eastern regions into a wider domestic market."
 POL_integrated_commonwealth_economy_idea:0 "Integrated Commonwealth Economy"
 POL_integrated_commonwealth_economy_idea_desc:0 "The industrial heartland and eastern lands now operate as a connected market with stronger production and distribution."
 POL_arsenal_of_eastern_europe_idea:0 "Arsenal of Eastern Europe"
 POL_arsenal_of_eastern_europe_idea_desc:0 "Factories and supply networks are prioritised for military production across the Commonwealth."
 POL_planned_federal_development_idea:0 "Planned Federal Development"
 POL_planned_federal_development_idea_desc:0 "Joint planning directs infrastructure and factory construction across the constituent lands, requiring sustained political attention."
 POL_expanded_chemical_sector:0 "Expanded Chemical Sector"
 POL_expanded_chemical_sector_desc:0 "New refineries and chemical plants increase synthetic output and the fuel derived from it."
 POL_synthetic_independence_idea:0 "Synthetic Independence"
 POL_synthetic_independence_idea_desc:0 "Domestic chemical research and refineries reduce reliance on imported fuel."
 POL_state_fuel_reserves_idea:0 "State Fuel Reserves"
 POL_state_fuel_reserves_idea_desc:0 "Refinery production and strategic depots give the Commonwealth a more secure fuel supply."
