 RUE_factionalism_modifier:0 "Factionalism"
 RUE_factionalism_modifier_tt:0 "§LFactionalism within the party was always a problem, and with the opposition more vocal, the differences of opinion makes the party less efficient. Properly managed, though, difference of opinion can in the long run be turned into a strength rather than a weakness.§!\n\n"

 RUE_opposition_popular_support:0 "Popular Support for Opposition"
 RUE_opposition_popular_support_tt:0 "§LWith a large part of the party members, and public opinion, in support of the opposition, maintaining a losing war is much more difficult.§!\n\n"

 RUE_workers_government_idea:0 "The Workers' Government"
 RUE_workers_government_idea_desc:0 "Long live the worker’s government. The Ruling Elite has been removed from power. The workers once more rule the country."
 RUE_revolutionary_spirit_idea:0 "The Revolutionary Spirit"
 RUE_revolutionary_spirit_idea_desc:0 "The revolutionary zeal has been reignited by the victory over Stalin. It is time to carry the revolutionary flame to the workers around the world."

 RUE_trotskyist_revolutionary_agitation:0 "Trotskyist Revolutionary Agitation"
 RUE_trotskyist_revolutionary_agitation_desc:1 "Trotskyist sympathizers and other communist elements aligned with the [RUE.GetAdjective] Bolshevik Party are stirring up the [ROOT.GetAdjective] masses, promoting the Marxist ideology among the working class and calling for an armed struggle against our government."
 RUE_trotskyist_revolutionary_agitation_tt:0 "Activating the decision §Y$ban_communist_party$§! will reduce the effects from this national spirit."
 RUE_politicized_military:0 "Politicized Military"
 RUE_politicized_military_desc:1 "Military commissars often hold fervent ideological speeches and political discussions among the ranks, but in many cases they also engage in excessive administration, overzealous scrutiny of military officers, and even obstruction of the orders of unit commanders."
 RUE_politicized_military_swap:0 "Military Political Advisors"
 RUE_politicized_military_swap_desc:1 "While we shouldn't let political considerations dictate military decisions, we still have to ensure that these political considerations are accounted for when the decision is reached."
 RUE_politicized_military_battle_priests:0 "Battle Priests in the Army"
 RUE_politicized_military_battle_priests_desc:1 "Taking on the role of Battle Priests within our military units, the clergy is now in charge of keeping morale high among the ranks, and making sure that the troops know that the Church, and God, are on our side."
 RUE_for_the_common_good_allies:0 "For the Common Good"
 RUE_for_the_common_good_allies_desc:1 "Every decision made by us or our allies must be aimed at taking a step forward towards the common good."
 RUE_for_the_common_good_subjects:0 "$RUE_for_the_common_good_allies$"
 RUE_for_the_common_good_subjects_desc:1 "Every decision made by our allies is aimed at taking a step forward towards the common good. Thus, we must support these decisions and make sure to follow the guidelines presented to us, even if our sacrifices are not met by an immediate improvement."

