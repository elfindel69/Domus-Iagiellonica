 RUE_anti_capitalist_campaign_generic:0 "Anti-Capitalist Campaign"
 RUE_anti_capitalist_campaign_generic_desc:1 "Capitalists cannot be trusted. When given the choice, the Bourgeoisie will always choose to oppress the proletariat. We must be prepared to take the fight to them."
 RUE_anti_fascist_campaign_generic:0 "Anti-Fascist Campaign"
 RUE_anti_fascist_campaign_generic_desc:1 "There can be no peaceful co-existence with the fascists. We must prepare for the inevitable confrontation."
 RUE_young_builders_of_communism:0 "Young Builders of Communism"
 RUE_young_builders_of_communism_desc:1 "We are not building Socialism for the adults of today, we are building it for the children and the generations not yet born. They must be taught how to improve and build on the achievements we make, so that they can complete the work that we have started."
 RUE_broken_peace_dreams_attacker:0 "Broken Peace Dreams"
 RUE_broken_peace_dreams_attacker_desc:1 "This new war we find ourselves in, not so long after we publicly promised to pursue policies of peace, is causing instability and distrust amnog the population."
 RUE_broken_peace_dreams_defender:0 "$RUE_broken_peace_dreams_attacker$"
 RUE_broken_peace_dreams_defender_desc:1 "$RUE_broken_peace_dreams_attacker_desc$"
 RUE_restoration_and_development_idea:0 "Restoration and Development"
 RUE_restoration_and_development_idea_desc:0 "$RUE_restoration_and_development_desc$"
 RUE_no_time_for_peace_idea:0 "No Time for Peace"
 RUE_no_time_for_peace_idea_desc:1 "$RUE_no_time_for_peace_desc$"

 RUE_support_in_china_generic:1 "[RUE.GetAdjective] Support in China"
 RUE_support_in_china_generic_desc:1 "The [RUE.GetAdjective] government is supporting [ROOT.GetNameDef] in our war against the [JAP.GetAdjective], expecting to develop closer ties with us while also influencing our politics."
 RUE_preparations_for_soviet_japanese_war:0 "Preparations for Soviet-Japanese War"
 RUE_preparations_for_soviet_japanese_war_desc:1 "$RUE_prepare_a_war_with_japan_desc$"
 RUE_soviet_japanese_reckoning:0 "Soviet-Japanese Reckoning"
 RUE_soviet_japanese_reckoning_desc:1 "It is time to bring the war to the [JAP.GetAdjective] and avenge the many wrongs they have caused us."
 RUE_soviet_japanese_anti_usa_pact:0 "Soviet-Japanese Anti-USA Pact"
 RUE_soviet_japanese_anti_usa_pact_desc:1 "Together, we will remove [USA.GetNameDef] from the world stage!"
 RUE_military_advisors_in_spain:0 "Military Advisors in Spain"
 RUE_military_advisors_in_spain_desc:1 "$RUE_send_military_advisors_to_spain_desc$"
 RUE_soviet_advisors_spr:0 "Soviet Military Advisors"
 RUE_soviet_advisors_spr_desc:1 "Military advisors and other skilled military personnel have arrived from the [RUE.GetNameDef] to support us in our fight against fascism and the reactionary counter-revolution."
 RUE_face_western_fascism_ns:0 "Face Western Fascism"
 RUE_face_western_fascism_ns_desc:1 "$RUE_eradicate_western_fascism_desc$"
 RUE_soviet_atomic_bomb_project_ns:0 "Soviet Atomic Bomb Project"
 RUE_soviet_atomic_bomb_project_ns_desc:1 "$RUE_soviet_atomic_bomb_project_desc$"
 RUE_stolen_vital_nuclear_information:0 "Stolen Vital Nuclear Information"
 RUE_stolen_vital_nuclear_information_desc:1 "$NSB_soviet_atomic_bomb_project.1.desc$"
 RUE_central_headquarters_of_the_partisan_movement:0 "Central Headquarters of the Partisan Movement"
 RUE_central_headquarters_of_the_partisan_movement_desc:1 "$RUE_organization_of_the_partisans_desc$"
 RUE_national_academy_of_sciences_puppet:0 "National Academy of Sciences"
 RUE_national_academy_of_sciences_puppet_desc:1 "Modelled after [GetTheUssrAcademyOfSciencesName], [RUE.GetNameDef] has established a new research institute in our country to boost both our scientific development and theirs."
 RUE_rehabilitated_military_ns:0 "$RUE_rehabilitated_military$"
 RUE_rehabilitated_military_ns_desc:1 "It is time to rein in the political officers a bit and give the commanders more latitude on how to run things."
 RUE_military_reorganization_ns:0 "Military Reorganization"
 RUE_military_reorganization_ns_desc:1 "The [GetSovietArmyAdjectiveBasedOnIdeology] Army is undergoing a huge reorganization, which requires disrupting the existing formations to some extent for a hopefully short period of time."
 RUE_expanded_exploitation_of_gold_mines:0 "Expanded Exploitation of Gold Mines"
 RUE_expanded_exploitation_of_gold_mines_desc:1 "The [RUE.GetAdjective] investemnt in infrastructure and industrial aid in the Northern territories of [ROOT.GetNameDef] has allowed us to increase the efficiency in the exploitation of our gold mines in the region."
 RUE_shocked_by_surprise_attack:0 "Shocked by Surprise Attack"
 RUE_shocked_by_surprise_attack_desc:0 "The enemy military operation against our country, codenamed Operation Countenance, has taken our government and military by surprise. Our forces are overwhelmed, our communications have been cut off, and summoning enemy diplomats to demand an explanation has turned out to be futile. While we try to figure out this chaos, our foreign relations are effectively neutralized."
 RUE_shocked_by_surprise_attack_cant_join_factions_tt:0 "Set the rule: £trigger_no Can join factions."
 RUE_soviet_commandos_poum:0 "Soviet Commandos"
 RUE_soviet_commandos_poum_desc:0 "The Right Opposition to Stalinism in [RUE.GetNameDef] has sent highly trained agents to our country to carry out special operations and teach our people how to wage war."
 RUE_popular_speeches_poum:0 "Popular Speeches"
 RUE_popular_speeches_poum_desc:0 "With the help of local organizations and influential members of the anti-Stalinist opposition abroad, we are conducting a large information and agitation campaign in our controlled territories to rekindle the flame of revolution among the masses."
 RUE_agents_in_the_stalinist_command_poum:0 "Agents in the Stalinist Command"
 RUE_agents_in_the_stalinist_command_poum_desc:0 "The Soviet Right Opposition managed to infiltrate several agents among the latest batch of military advisers sent to the Spanish Republic by [RUE.GetLeader]. These agents have created a network of informants that allow us to learn about the enemy plans before they are carried out."
 RUE_polish_deal:0 "Polish Deal"
 RUE_polish_deal_desc:0 "The [RUE.GetAdjective] have made a deal with the Polish government to allow us to station troops in their territory. This will allow us to better defend our borders against the German threat."
 RUE_baltic_deal:0 "Baltic Deal"
 RUE_baltic_deal_desc:0 "The [RUE.GetAdjective] have made a deal with the Baltic governments to allow us to station troops in their territory. This will allow us to better defend our borders against the German threat."
 RUE_monarchist_science:0 "Monarchist Science"
 RUE_monarchist_science_desc:0 "We have formed new Research Institutes in our country, which will allow us to better coordinate our research efforts and increase our scientific output."



